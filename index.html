        <div id="listTab">

                <div class="button-group">

    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalPersonName"></span>의 날짜 관리
        </div>
        <div style="margin-bottom: 16px;">
            <input type="text" id="newDateInput" placeholder="새 날짜 (예: 10/1)" style="width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 8px;">
            <button class="btn btn-success btn-small" onclick="addDateToVolunteer()" style="width: 100%;">
                ➕ 날짜 추가
            </button>
        </div>
        <div id="dateList"></div>
        <div style="margin-top: 16px;">
            <button class="btn btn-secondary" onclick="closeDateModal()" style="width: 100%;">
                닫기
            </button>
        </div>
    </div>
</div>

<script>
    let volunteers = [
        { name: "한우리", count: 1, dates: ["7/6"] },
        { name: "손효서", count: 2, dates: ["7/27", "9/28"] },
        { name: "박시원", count: 2, dates: ["2/2", "3/31"] },
        { name: "심규민", count: 2, dates: ["1/12", "5/31"] },
        { name: "강지연", count: 3, dates: ["5/31", "7/13", "9/7"] },
        { name: "남재봉", count: 3, dates: ["3/9", "6/7", "8/24"] },
        { name: "선주향", count: 3, dates: ["2/23", "4/20", "6/7"] },
        { name: "안재혁", count: 4, dates: ["2/9", "4/6", "6/29", "8/24"] },
        { name: "최성영", count: 4, dates: ["2/23", "4/20", "6/15", "8/17"] },
        { name: "박진우", count: 5, dates: ["2/23", "4/20", "5/24", "7/27", "9/14"] },
        { name: "강창우", count: 5, dates: ["12/22", "2/16", "4/13", "5/17", "7/13"] },
        { name: "김지훈", count: 5, dates: ["12/15", "2/2", "3/23", "5/3", "7/13"] },
        { name: "손다민", count: 6, dates: ["1/26", "3/16", "5/10", "6/15", "8/17", "9/28"] },
        { name: "선가영", count: 6, dates: ["12/29", "2/2", "3/23", "5/17", "8/17", "9/21"] },
        { name: "김다은", count: 6, dates: ["12/8", "1/19", "3/16", "4/27", "7/6", "9/7"] },
        { name: "박예진", count: 6, dates: ["1/5", "2/16", "4/6", "5/10", "8/3", "9/14"] },
        { name: "정재욱", count: 6, dates: ["12/8", "1/19", "3/9", "5/3", "6/29", "8/31"] },
        { name: "위하영", count: 6, dates: ["12/22", "1/26", "3/23", "5/3", "6/22", "8/31"] },
        { name: "장하현", count: 6, dates: ["12/29", "2/16", "4/6", "5/17", "6/22", "8/3"] },
        { name: "김다연", count: 7, dates: ["12/15", "1/19", "3/2", "4/27", "6/7", "8/24", "9/21"] },
        { name: "손탁안", count: 7, dates: ["12/15", "1/26", "3/16", "4/27", "6/15", "7/27", "9/28"] },
        { name: "송승재", count: 7, dates: ["12/22", "2/9", "3/31", "5/10", "6/22", "6/29", "8/31"] }
    ];

    let exchangeRequests = [];
    let currentEditingPerson = null;

    function renderVolunteers() {
        const sorted = [...volunteers].sort((a, b) => a.count - b.count);
        const tbody = document.getElementById('volunteerTable');
        tbody.innerHTML = sorted.map(v => `
            <tr>
                <td style="font-weight: 600;">${v.name}</td>
                <td style="text-align: center;">
                    <span class="count-badge">${v.count}</span>
                </td>
                <td style="font-size: 14px; color: #4b5563;">${v.dates.join(', ')}</td>
                <td style="text-align: center;">
                    <button class="btn btn-primary btn-small" onclick="openDateModal('${v.name}')">
                        📅 관리
                    </button>
                </td>
            </tr>
        `).join('');
        
        updateSelects();
    }

    function updateSelects() {
        const requesterSelect = document.getElementById('requester');
        const responderSelect = document.getElementById('responder');
        
        const options = volunteers.map(v => 
            `<option value="${v.name}">${v.name}</option>`
        ).join('');
        
        requesterSelect.innerHTML = '<option value="">바꾸고 싶은 사람 (본인)</option>' + options;
        responderSelect.innerHTML = '<option value="">바꿔줄 사람</option>' + options;
    }

    function openDateModal(personName) {
        currentEditingPerson = personName;
        document.getElementById('modalPersonName').textContent = personName;
        document.getElementById('newDateInput').value = '';
        renderDateList();
        const modal = document.getElementById('dateModal');
        modal.style.display = 'flex';
        modal.classList.remove('hidden');
    }

    function closeDateModal() {
        const modal = document.getElementById('dateModal');
        modal.style.display = 'none';
        modal.classList.add('hidden');
        currentEditingPerson = null;
    }

    function closeModalOnBackdrop(event) {
        if (event.target.id === 'dateModal') {
            closeDateModal();
        }
    }

    function renderDateList() {
        const person = volunteers.find(v => v.name === currentEditingPerson);
        if (!person) return;

        const dateList = document.getElementById('dateList');
        if (person.dates.length === 0) {
            dateList.innerHTML = '<p style="text-align: center; color: #6b7280; padding: 20px;">아직 날짜가 없습니다</p>';
            return;
        }

        dateList.innerHTML = person.dates.map(date => `
            <div class="date-item">
                <span>${date}</span>
                <button class="btn btn-danger btn-small" onclick="removeDateFromVolunteer('${date}')">
                    삭제
                </button>
            </div>
        `).join('');
    }

    function addDateToVolunteer() {
        const newDate = document.getElementById('newDateInput').value.trim();
        if (!newDate) {
            alert('날짜를 입력해주세요!');
            return;
        }

        volunteers = volunteers.map(v => {
            if (v.name === currentEditingPerson) {
                if (v.dates.includes(newDate)) {
                    alert('이미 등록된 날짜입니다!');
                    return v;
                }
                const newDates = [...v.dates, newDate].sort();
                return { ...v, dates: newDates, count: newDates.length };
            }
            return v;
        });

        document.getElementById('newDateInput').value = '';
        renderDateList();
        renderVolunteers();
    }

    function removeDateFromVolunteer(date) {
        if (!confirm(`${date} 날짜를 삭제하시겠습니까?`)) {
            return;
        }

        volunteers = volunteers.map(v => {
            if (v.name === currentEditingPerson) {
                const newDates = v.dates.filter(d => d !== date);
                return { ...v, dates: newDates, count: newDates.length };
            }
            return v;
        });

        renderDateList();
        renderVolunteers();
    }

    function renderExchangeRequests() {
        const container = document.getElementById('requestsList');
        const pending = exchangeRequests.filter(r => r.status === 'pending').length;
        document.getElementById('pendingCount').textContent = pending;
        
        if (exchangeRequests.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div style="font-size: 48px; margin-bottom: 12px;">🔄</div>
                    <p>아직 교환 요청이 없습니다</p>
                </div>
            `;
            return;
        }
        
        container.innerHTML = exchangeRequests.map(req => `
            <div class="request-card ${req.status}">
                <div class="request-content">
                    <div class="request-info">
                        <div style="font-weight: bold; margin-bottom: 8px; color: #1f2937;">
                            ${req.requester} → ${req.responder}
                        </div>
                        <div style="font-size: 14px; color: #4b5563; margin-bottom: 4px;">
                            📅 날짜: <strong>${req.date}</strong>
                        </div>
                        ${req.reason ? `
                        <div style="font-size: 13px; color: #6b7280; margin-bottom: 4px; padding: 8px; background: white; border-radius: 6px;">
                            💬 사유: ${req.reason}
                        </div>
                        ` : ''}
                        <div style="font-size: 12px; color: #6b7280;">
                            ${req.status === 'pending' ? '⏳ 승인 대기중' : 
                              req.status === 'approved' ? '✅ 승인됨' : '❌ 거절됨'}
                        </div>
                    </div>
                    ${req.status === 'pending' ? `
                        <div class="request-actions">
                            <button class="icon-btn btn-success" onclick="approveExchange(${req.id})" title="승인">
                                ✓
                            </button>
                            <button class="icon-btn btn-danger" onclick="rejectExchange(${req.id})" title="거절">
                                ✕
                            </button>
                        </div>
                    ` : ''}
                </div>
            </div>
        `).join('');
    }

    function switchTab(tab) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));
        
        if (tab === 'list') {
            tabs[0].classList.add('active');
            document.getElementById('listTab').classList.remove('hidden');
            document.getElementById('exchangeTab').classList.add('hidden');
        } else {
            tabs[1].classList.add('active');
            document.getElementById('listTab').classList.add('hidden');
            document.getElementById('exchangeTab').classList.remove('hidden');
            renderExchangeRequests();
        }
    }

    function toggleAddForm() {
        const form = document.getElementById('addForm');
        form.classList.toggle('hidden');
        if (!form.classList.contains('hidden')) {
            document.getElementById('exchangeForm').classList.add('hidden');
        }
    }

    function toggleExchangeForm() {
        const form = document.getElementById('exchangeForm');
        form.classList.toggle('hidden');
        if (!form.classList.contains('hidden')) {
            document.getElementById('addForm').classList.add('hidden');
        }
    }

    function addVolunteer() {
        const name = document.getElementById('newName').value.trim();
        const datesStr = document.getElementById('newDates').value.trim();
        
        if (!name || !datesStr) {
            alert('이름과 날짜를 모두 입력해주세요!');
            return;
        }
        
        const dates = datesStr.split(',').map(d => d.trim()).filter(d => d);
        volunteers.push({
            name: name,
            count: dates.length,
            dates: dates
        });
        
        document.getElementById('newName').value = '';
        document.getElementById('newDates').value = '';
        toggleAddForm();
        renderVolunteers();
        alert('봉사자가 추가되었습니다!');
    }

    function createExchangeRequest() {
        const requester = document.getElementById('requester').value;
        const responder = document.getElementById('responder').value;
        const date = document.getElementById('exchangeDate').value.trim();
        const reason = document.getElementById('exchangeReason').value.trim();
        
        if (!requester || !responder || !date) {
            alert('이름과 날짜는 필수 항목입니다!');
            return;
        }
        
        if (requester === responder) {
            alert('본인과는 교환할 수 없습니다!');
            return;
        }
        
        exchangeRequests.push({
            id: Date.now(),
            requester: requester,
            responder: responder,
            date: date,
            reason: reason,
            status: 'pending'
        });
        
        document.getElementById('requester').value = '';
        document.getElementById('responder').value = '';
        document.getElementById('exchangeDate').value = '';
        document.getElementById('exchangeReason').value = '';
        toggleExchangeForm();
        alert('교환 요청이 전송되었습니다!');
        renderExchangeRequests();
    }

    function approveExchange(requestId) {
        const request = exchangeRequests.find(r => r.id === requestId);
        if (!request) return;
        
        volunteers = volunteers.map(v => {
            if (v.name === request.requester) {
                const newDates = v.dates.filter(d => d !== request.date);
                return { ...v, dates: newDates, count: newDates.length };
            }
            if (v.name === request.responder) {
                const newDates = [...v.dates, request.date].sort();
                return { ...v, dates: newDates, count: newDates.length };
            }
            return v;
        });
        
        exchangeRequests = exchangeRequests.map(r => 
            r.id === requestId ? { ...r, status: 'approved' } : r
        );
        
        renderVolunteers();
        renderExchangeRequests();
        alert('교환이 승인되었습니다!');
    }

    function rejectExchange(requestId) {
        exchangeRequests = exchangeRequests.map(r => 
            r.id === requestId ? { ...r, status: 'rejected' } : r
        );
        renderExchangeRequests();
        alert('교환이 거절되었습니다.');
    }

    renderVolunteers();
</script>
